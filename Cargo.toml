[package]
name = "egui-shadcn-ui"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "A shadcn/ui-flavoured component library for egui, in pure Rust."
license = "MIT"
readme = "README.md"
repository = "https://github.com/rumman02/egui-shadcn"
keywords = ["egui", "shadcn", "gui", "components", "design-system"]
categories = ["gui"]

[features]
default = ["fonts"]
# Embed Inter + Geist Mono and install them on `Preset::install` (see
# `src/theme/fonts.rs`). Disable to ship without the embedded font bytes;
# text then renders with the host's fonts and weight helpers degrade to
# regular-weight rendering.
fonts = []

[dependencies]
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }

# The library itself needs nothing else; the gallery example uses eframe.
[dev-dependencies]
eframe = { version = "0.37", default-features = true }

[lib]
path = "src/lib.rs"

[profile.dev]
opt-level = 1

[[example]]
name = "gallery"
path = "examples/gallery/main.rs"
