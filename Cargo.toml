[package]
name = "egui-shadcn-ui"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "A shadcn/ui-flavoured component library for egui, in pure Rust."
license = "MIT"
readme = "README.md"

[dependencies]
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }

# The library itself needs nothing else; the gallery example uses eframe.
[dev-dependencies]
eframe = { version = "0.37", default-features = true }

[lib]
path = "src/lib.rs"

[profile.dev]
opt-level = 1

[[example]]
name = "gallery"
path = "examples/gallery/main.rs"
